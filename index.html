<!DOCTYPE html>
<html>
<head>
    <title>أدواتي الذكية 🧮</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
          background-color: #e8f0fe;
            padding-top: 100px;
        }

        .box {
            background-color: #ffffff;
border-radius: 15px;
box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 350px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            font-size: 36px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

       button {
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 15px;
    background-color: #4a90e2;
    color: white;
    border: none;
    border-radius: 10px;
}

        button:hover {
    background-color: #357abd;
}
        nav {
    margin-bottom: 20px;
}

nav a {
    text-decoration: none;
    background-color: #4a90e2;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    margin: 5px;
}
        #result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">
<h2>أدواتي الذكية 🧮</h2>
<p>أدوات مجانية وسريعة تساعدك على إنجاز الحسابات اليومية بسهولة.</p>
<h1>حاسبة العمر 🎂</h1>
<p>احسب عمرك بدقة بالسنوابة ت والأشهر والأيام.</p>
       <nav>
<a href="index.html">حاسبة العمر</a>
<a href="percentage.html">حاسبة النسبة المئوية</a>
</nav>
        <p>أدخل تاريخ ميلادك:</p>

        <input type="date" id="birthdate">

        <br>

        <button onclick="calculateAge()">احسب عمري</button>

        <p id="result"></p>

    </div>
<script>
function calculateAge() {
    let birth = new Date(document.getElementById("birthdate").value);
    let today = new Date();

    if (!document.getElementById("birthdate").value) {
        document.getElementById("result").innerHTML =
            "⚠️ اختر تاريخ ميلادك أولاً";
        return;
    }

    let years = today.getFullYear() - birth.getFullYear();
    let months = today.getMonth() - birth.getMonth();
    let days = today.getDate() - birth.getDate();

    if (days < 0) {
        months--;
        days += new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    let nextBirthday = new Date(
        today.getFullYear(),
        birth.getMonth(),
        birth.getDate()
    );

    if (nextBirthday < today) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
    }

    let daysUntilBirthday = Math.ceil(
        (nextBirthday - today) / (1000 * 60 * 60 * 24)
    );

    document.getElementById("result").innerHTML =
        "🎉 عمرك هو: " +
        years + " سنة و " +
        months + " شهر و " +
        days + " يوم" +
        "<br><br>🎂 عيد ميلادك القادم بعد: " +
        daysUntilBirthday + " يوم";
}
</script>

</body>
</html>

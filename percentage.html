<!DOCTYPE html>
<html>
<head>
    <title>حاسبة النسبة المئوية</title>
</head>

<body>
    <h1>حاسبة النسبة المئوية</h1>

    <p>اكتب الرقم:</p>
    <input type="number" id="number">
<p>نوع العملية:</p>
<select id="operation">
    <option value="normal">حساب النسبة</option>
    <option value="increase">زيادة بنسبة</option>
    <option value="decrease">خصم بنسبة</option>
</select>
    <p>اكتب النسبة المئوية:</p>
    <input type="number" id="percent">

    <br><br>

    <button onclick="calculatePercentage()">احسب</button>

    <p id="result"></p>

    <script>
        function calculatePercentage() {
            let number = document.getElementById("number").value;
            let percent = document.getElementById("percent").value;
if (number === "" || percent === "") {
    document.getElementById("result").innerHTML =
        "⚠️ أدخل الرقم والنسبة أولاً";
    return;
}
            let result = number * percent / 100;
let operation = document.getElementById("operation").value
    let changeAmount = number * percent / 100;
if (operation === "increase") {
    result = number * (1 + percent / 100);
} else if (operation === "decrease") {
    result = number * (1 - percent / 100);
}
    if (operation === "normal") {
    document.getElementById("result").innerHTML =
        "🧮 " + percent + "% من " + number +
        " = <strong>" + result + "</strong>";

} else if (operation === "increase") {
    document.getElementById("result").innerHTML =
        "📈 زيادة " + number + " بنسبة " + percent + "٪<br>"
        "➕ مقدار الزيادة: <strong>" + changeAmount + "</strong><br>" +
        "💰 النتيجة: <strong>" + result + "</strong>";

} else {
    document.getElementById("result").innerHTML =
        "📉 خصم " + percent + "% من " + number + "<br>" +
        "➖ مقدار الخصم: <strong>" + changeAmount + "</strong><br>" +
        "💰 النتيجة: <strong>" + result + "</strong>";
}
}
</script>
    </script>

</body>
</html>
